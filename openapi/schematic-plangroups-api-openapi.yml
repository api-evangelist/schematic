openapi: 3.2.0
info:
  title: Schematic accesstokens Plangroups API
  version: '0.1'
  description: Schematic API
  x-rules-engine-schema-version: v97288f60
servers:
- url: https://api.schematichq.com
security:
- ApiKeyAuth: []
tags:
- name: plangroups
paths:
  /plan-groups:
    get:
      operationId: getPlanGroup
      summary: Get plan group
      tags:
      - plangroups
      parameters:
      - name: include_company_counts
        in: query
        schema:
          type: boolean
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/PlanGroupDetailResponseData'
                  params:
                    type: object
                    description: Input parameters
                    properties:
                      include_company_counts:
                        type: boolean
                    title: GetPlanGroupParams
                required:
                - data
                - params
                title: GetPlanGroupResponse
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'
    post:
      operationId: createPlanGroup
      summary: Create plan group
      tags:
      - plangroups
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePlanGroupRequestBody'
        required: true
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/PlanGroupResponseData'
                  params:
                    type: object
                    description: Input parameters
                    title: CreatePlanGroupParams
                required:
                - data
                - params
                title: CreatePlanGroupResponse
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'
  /plan-groups/{plan_group_id}:
    put:
      operationId: updatePlanGroup
      summary: Update plan group
      tags:
      - plangroups
      parameters:
      - name: plan_group_id
        in: path
        description: plan_group_id
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdatePlanGroupRequestBody'
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/PlanGroupResponseData'
                  params:
                    type: object
                    description: Input parameters
                    title: UpdatePlanGroupParams
                required:
                - data
                - params
                title: UpdatePlanGroupResponse
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'
