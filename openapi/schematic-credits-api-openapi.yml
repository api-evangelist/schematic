components:
  schemas:
    ApiError:
      type: object
      properties:
        error:
          type: string
          description: Error message
      required:
      - error
    BillingCreditResponseData:
      type: object
      properties:
        burn_strategy:
          $ref: '#/components/schemas/BillingCreditBurnStrategy'
        cost_editable:
          type: boolean
        created_at:
          type: string
          format: date-time
        currency_prices:
          type: array
          items:
            $ref: '#/components/schemas/CreditCurrencyPriceResponseData'
          maxItems: 256
        default_expiry_unit:
          $ref: '#/components/schemas/BillingCreditExpiryUnit'
        default_expiry_unit_count:
          type:
          - integer
          - 'null'
          format: int64
        default_rollover_policy:
          $ref: '#/components/schemas/BillingCreditRolloverPolicy'
        description:
          type: string
        icon:
          type:
          - string
          - 'null'
        id:
          type: string
        name:
          type: string
        plural_name:
          type:
          - string
          - 'null'
        price:
          $ref: '#/components/schemas/BillingPriceResponseData'
        product:
          $ref: '#/components/schemas/BillingProductResponseData'
        singular_name:
          type:
          - string
          - 'null'
        updated_at:
          type: string
          format: date-time
      required:
      - id
      - name
      - description
      - default_expiry_unit
      - default_rollover_policy
      - burn_strategy
      - cost_editable
      - currency_prices
      - created_at
      - updated_at
      title: BillingCreditResponseData
    BillingPriceScheme:
      type: string
      enum:
      - per_unit
      - tiered
    CreditLedgerPeriod:
      type: string
      enum:
      - daily
      - monthly
      - raw
      - weekly
    CreditAutoTopupAmountType:
      type: string
      enum:
      - credit
    UpdateBillingPlanCreditGrantRequestBody:
      type: object
      properties:
        apply_to_existing:
          type:
          - boolean
          - 'null'
        auto_topup_amount:
          type:
          - integer
          - 'null'
          format: int64
          minimum: 1
        auto_topup_amount_type:
          allOf:
          - $ref: '#/components/schemas/CreditAutoTopupAmountType'
        auto_topup_enabled:
          type:
          - boolean
          - 'null'
        auto_topup_expiry_type:
          allOf:
          - $ref: '#/components/schemas/BillingCreditExpiryType'
        auto_topup_expiry_unit:
          allOf:
          - $ref: '#/components/schemas/BillingCreditExpiryUnit'
        auto_topup_expiry_unit_count:
          type:
          - integer
          - 'null'
          format: int64
          minimum: 1
        auto_topup_threshold_credits:
          type:
          - integer
          - 'null'
          format: int64
          minimum: 0
        auto_topup_threshold_percent:
          type:
          - integer
          - 'null'
          format: int64
          maximum: 100
          minimum: 1
        credit_amount:
          type:
          - integer
          - 'null'
          format: int64
          maximum: 9999999999
          minimum: 0
        expiry_type:
          allOf:
          - $ref: '#/components/schemas/BillingCreditExpiryType'
        expiry_unit:
          allOf:
          - $ref: '#/components/schemas/BillingCreditExpiryUnit'
        expiry_unit_count:
          type:
          - integer
          - 'null'
          format: int64
          minimum: 1
        reset_cadence:
          $ref: '#/components/schemas/BillingPlanCreditGrantResetCadence'
        reset_start:
          $ref: '#/components/schemas/BillingPlanCreditGrantResetStart'
        reset_type:
          allOf:
          - $ref: '#/components/schemas/BillingPlanCreditGrantResetType'
      required:
      - reset_cadence
      - reset_start
